<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Output throughput vs. concurrency">

<style>
  .surface { fill: #fcfcfb; }
  .ink-1 { fill: #0b0b0b; }
  .ink-2 { fill: #52514e; }
  .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; }
  .axis { stroke: #c3c2b7; }
  .ref { stroke: #898781; }
  .s1 { stroke: #2a78d6; }
  .s1-fill { fill: #2a78d6; }
  .s2 { stroke: #eb6834; }
  .s2-fill { fill: #eb6834; }
  .ring { stroke: #fcfcfb; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tick { font-size: 12px; font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink-1 { fill: #f0efec; }
    .ink-2 { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; }
    .axis { stroke: #383835; }
    .s1 { stroke: #3987e5; }
    .s1-fill { fill: #3987e5; }
    .s2 { stroke: #d95926; }
    .s2-fill { fill: #d95926; }
    .ring { stroke: #1a1a19; }
  }
</style>

<rect class="surface" width="720" height="380" rx="8"/>
<text class="ink-1" x="64" y="28" font-size="16" font-weight="600">Output throughput vs. concurrency</text>
<text class="ink-2" x="64" y="48" font-size="13">Total output tokens per second across all in-flight requests</text>
<line class="s1" x1="64" y1="64" x2="84" y2="64" stroke-width="2"/>
<text class="ink-2" x="90" y="68" font-size="12">Measured</text>
<line class="ref" x1="170" y1="64" x2="190" y2="64" stroke-width="2" stroke-dasharray="6 4"/>
<text class="ink-2" x="196" y="68" font-size="12">Ideal linear scaling</text>
<line class="axis" x1="64" y1="324.0" x2="544" y2="324.0" stroke-width="1"/>
<text class="muted tick" x="54" y="328.0" text-anchor="end">0</text>
<line class="grid" x1="64" y1="274.4" x2="544" y2="274.4" stroke-width="1"/>
<text class="muted tick" x="54" y="278.4" text-anchor="end">500</text>
<line class="grid" x1="64" y1="224.8" x2="544" y2="224.8" stroke-width="1"/>
<text class="muted tick" x="54" y="228.8" text-anchor="end">1,000</text>
<line class="grid" x1="64" y1="175.2" x2="544" y2="175.2" stroke-width="1"/>
<text class="muted tick" x="54" y="179.2" text-anchor="end">1,500</text>
<line class="grid" x1="64" y1="125.6" x2="544" y2="125.6" stroke-width="1"/>
<text class="muted tick" x="54" y="129.6" text-anchor="end">2,000</text>
<line class="grid" x1="64" y1="76.0" x2="544" y2="76.0" stroke-width="1"/>
<text class="muted tick" x="54" y="80.0" text-anchor="end">2,500</text>
<text class="muted tick" x="64.0" y="344" text-anchor="middle">1</text>
<text class="muted tick" x="184.0" y="344" text-anchor="middle">2</text>
<text class="muted tick" x="304.0" y="344" text-anchor="middle">4</text>
<text class="muted tick" x="424.0" y="344" text-anchor="middle">8</text>
<text class="muted tick" x="544.0" y="344" text-anchor="middle">16</text>
<text class="ink-2" x="304.0" y="368" font-size="12" text-anchor="middle">Concurrent requests</text>
<polyline class="ref" points="64.0,309.9 184.0,295.8 304.0,267.6 424.0,211.2 544.0,98.4" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<polyline class="s1" points="64.0,309.9 184.0,296.3 304.0,271.4 424.0,228.6 544.0,158.1" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="s1-fill ring" cx="64.0" cy="309.9" r="5" stroke-width="2"/>
<circle class="s1-fill ring" cx="184.0" cy="296.3" r="5" stroke-width="2"/>
<circle class="s1-fill ring" cx="304.0" cy="271.4" r="5" stroke-width="2"/>
<circle class="s1-fill ring" cx="424.0" cy="228.6" r="5" stroke-width="2"/>
<circle class="s1-fill ring" cx="544.0" cy="158.1" r="5" stroke-width="2"/>
<text class="ink-2" x="558.0" y="96.4" font-size="13" font-weight="600">Ideal 2,274 tok/s</text>
<text class="ink-2" x="558.0" y="112.4" font-size="12">16× concurrency 1</text>
<text class="ink-1" x="558.0" y="156.1" font-size="13" font-weight="600">1,672 tok/s</text>
<text class="ink-2" x="558.0" y="172.1" font-size="12">11.8× concurrency 1</text>
<text class="ink-1" x="74.0" y="297.9" font-size="12">142 tok/s</text>
</svg>